tables:
  avantifellows.external_data_sources.cuet_dim_merit_rules:
    claude_md_summary: "CUET (UG) merit rules from the 2025 bulletins of DU, BHU, Allahabad, CUSB, JNU and Jamia: which CUET papers each course adds up (e.g. Physics + Chemistry + Maths, out of 750), as text and as JSON combinations, with proration flag and the bulletin page. 58 rules (DU 25, CUSB 13, BHU 8, ALD 7, JMI 4, JNU 1). Join courses via cuet_dim_program_rules."
    description: |
      One row per rule_id. A DU/BHU cutoff is ONE number, but it is the sum of
      the per-paper normalized CUET scores (each out of 250) that the course
      counts. This table says which papers. Courses map to rules in
      cuet_dim_program_rules.

      GOTCHAS:
      1. A RULE IS A SET OF ALTERNATIVES. `combinations_json` is a list of
         combinations; the course takes the student's BEST one. Slots: "L" any
         language, "B" any domain subject, "G" GAT, or a list of paper ids (one of
         them). A paper fills one slot only.
      2. SCALES DIFFER: max_score is 250 x the largest combination (250 / 500 /
         750 / 1000). Compare a cutoff only with scores on the same rule.
      3. prorated = TRUE means the course mixes combination sizes (DU B.A.
         Program: 4 papers, or language + subject + GAT). DU says only
         "appropriate proration will be done"; the predictor scales the smaller
         combination up (x 4/3, x 2). That formula is an assumption, not DU's
         published one.
      4. needs_language = TRUE: DU science courses count three science papers
         but require the student to have written a language paper (not counted).
      5. Courses with a practical / performance test are not here (CUET alone
         doesn't decide them).
      6. missing_counts_zero = TRUE (Allahabad, rule ids ALD_*): a paper the
         student didn't take counts 0 rather than making the course
         unreachable.

    coverage:
      years: [2025]
      notes: "Read from BigQuery on 2026-10-05. 58 rules: DU 25, CUSB 13, BHU 8, ALD 7, JMI 4, JNU 1."

    core_columns:
      rule_id: {type: STRING, description: "e.g. 'DU_PCM', 'BHU_L_GAT'. Primary key."}
      university: {type: STRING, description: "'DU', 'BHU', 'ALD' (University of Allahabad), 'CUSB' (Central University of South Bihar), 'JNU' or 'JMI' (Jamia Millia Islamia)."}
      papers: {type: STRING, description: "Readable combinations: 'Language + Maths + 2 subjects, or language + Accountancy + 2 subjects'."}
      combinations_json: {type: STRING, description: "JSON list of combinations (GOTCHA #1)."}
      n_combinations: {type: INTEGER, description: "Number of alternatives."}
      max_score: {type: INTEGER, description: "Scale of the printed cut-offs: highest possible score (GOTCHA #2). JNU prints the paper total rescaled to 100."}
      papers_max: {type: INTEGER, description: "Raw paper total (250 x papers). Differs from max_score only where the university rescales (JNU: 500 -> 100)."}
      prorated: {type: BOOLEAN, description: "Mixed combination sizes, smaller scaled up (GOTCHA #3)."}
      needs_language: {type: BOOLEAN, description: "Language paper required but not counted (GOTCHA #4)."}
      missing_counts_zero: {type: BOOLEAN, description: "A paper not taken counts 0 (GOTCHA #6)."}
      source_url: {type: STRING, description: "The university bulletin the rule is read from."}
      source_ref: {type: STRING, description: "Where in it: DU bulletin page(s), BHU eligibility entry number(s), Allahabad guideline entry / notices, CUSB Annexure I row, JNU policy, Jamia prospectus page."}
      year: {type: INTEGER, description: "2025 (admission year)."}

example_queries:
  - question: "Which papers does DU B.Sc. (Hons.) Physics count, and out of what?"
    sql: |
      SELECT p.program, m.papers, m.max_score, m.source_ref
      FROM `avantifellows.external_data_sources.cuet_dim_program_rules` p
      JOIN `avantifellows.external_data_sources.cuet_dim_merit_rules` m USING (rule_id)
      WHERE p.university = 'DU' AND p.program = 'B.Sc (Hons.) Physics'
  - question: "DU open-category cutoffs as a share of each course's maximum, highest first"
    sql: |
      SELECT f.college_name, f.program_name, f.min_allocation_score, m.max_score,
        ROUND(f.min_allocation_score / m.max_score, 3) AS share_of_max
      FROM `avantifellows.external_data_sources.ducuet_fact_cutoffs` f
      JOIN `avantifellows.external_data_sources.cuet_dim_program_rules` p
        ON p.university = 'DU' AND p.program = f.program_name
      JOIN `avantifellows.external_data_sources.cuet_dim_merit_rules` m USING (rule_id)
      WHERE f.category = 'UR'
      ORDER BY share_of_max DESC
      LIMIT 20
