# udise_fact_facility_dsp
#
# Built by udise/scripts/dsp_build_bq.py from the DSP facility_data staging tables,
# plus the 2025-26-only safety file group. Regenerable end to end from the portal
# zips in gs://avantifellows-external-data/udise/raw/dsp/.

description: >
  UDISE+ Data Sharing Portal school facilities and safety: one row per school per
  academic year, for 2020-21, 2022-23, 2023-24, 2024-25 and 2025-26. Join to
  udise_dim_school_dsp on (academic_year, pseudocode) for state, management and
  school category.

  WHAT THIS COVERS. The physical plant and provisions of the school as reported on
  its annual UDISE+ Data Capture Format return: building condition, classrooms,
  toilets, drinking water, electricity, library, playground, laboratories, digital
  equipment — and, from 2025-26, the school-safety block (disaster-management plan,
  CCTV, fire extinguishers, self-defence training, child-protection measures).

  WHY SAFETY IS IN THIS TABLE AND NOT ITS OWN. The source publishes it as a separate
  file group, but it is the same grain, the same subject (the school's physical and
  operational environment), and 2025-26's facility file already carries
  students_oriented_cyber_safety and students_trained_psychosocial. Splitting would
  scatter one topic across two tables. Every safety column is NULL before 2025-26.

  TWO SENTINELS WILL WRECK AN AVERAGE IF YOU MISS THEM.
    * 9 means "Not Applicable" throughout the DSP release, on almost any coded
      column. It is not a category and not a count.
    * Yes is 1 and No is **2**, not 0. Every column ending `_yn` and most of the
      flag-shaped ones. A truthiness test is wrong for every "No" row.

  DRINKING WATER IS NOT COMPARABLE ACROSS THE 2020-21 BOUNDARY. 2020-21 publishes a
  single available/functional pair (drinking_water_available,
  drinking_water_functional). From 2022-23 the source replaces it with twelve
  source-specific yes/no columns — hand pump, protected well, tap, other source,
  unprotected well, packaged, each with a matching `_functional_yn`. There is no
  clean crosswalk between the two designs, so a water-access time series that
  crosses that boundary is measuring two different questions. Both are carried;
  neither is folded into the other.

  COVERAGE VARIES SHARPLY BY EDITION — a NULL means "not published that year", not
  "the school lacks it":
    * 2020-21 only: drinking_water_available, drinking_water_functional, ict_lab.
      It also publishes CWSN toilets as functional counts only, with no totals, so
      boys_cwsn_toilets / girls_cwsn_toilets are NULL that year while
      *_functional are populated.
    * 2022-23 onward: the twelve water-source columns, boys_cwsn_toilets and
      girls_cwsn_toilets, book_bank, reading_corner, playground_alternative_yn,
      the nine `*_lab_code` condition columns, computer_ict_lab_yn,
      ict_lab_samagra_yn, teaching_devices, servers, smart_classrooms,
      special_educator_code.
    * 2025-26 only: librarian_yn, land_available_yn, kitchen_garden_yn,
      staff_quarters_yn, tinkering_lab_yn, the four boarding_*_yn columns,
      students_oriented_cyber_safety, students_trained_psychosocial,
      enrichment_activities_yn, and the whole safety block.

  THE SOURCE MISSPELLS ONE COLUMN. 2020-21 publishes girls' urinals as
  `urinla_girls`; every later edition uses `urinal_girls`. Both are mapped to
  girls_urinals here, so the five-year series is continuous.

  THE SCHOOL KEY IS PSEUDONYMISED. `pseudocode` joins to the other DSP tables
  within a year and reaches nothing else. Cross-year stability is unverified.

  NO PII. School attributes only.

rows: 7385291
grain: (academic_year, pseudocode)
partitioned_by: academic_year_start (integer range)
clustered_by: [pseudocode]
validation: >
  One row per school per year in all five editions, matching udise_dim_school_dsp
  exactly, with zero rows orphaned from it. Direction-of-travel checks that behave
  as expected: schools with electricity 83.9% (2020-21) rising to 93.5% (2025-26);
  schools with at least one functional girls' toilet 92.5% rising to 94.6%; CCTV
  populated only in 2025-26, at 409,868 schools (27.9%), and zero elsewhere —
  confirming the safety block is correctly confined to that edition.

source:
  publisher: Ministry of Education, Government of India
  dataset: UDISE+ Data Sharing Portal — School Facility, plus School Safety (2025-26)
  editions: [2020-21, 2022-23, 2023-24, 2024-25, 2025-26]
  raw: >
    gs://avantifellows-external-data/udise/raw/dsp/<year>/facility_data_All State_<year>.zip
    and safety_All State_2025-26.zip
  codebooks: udise/docs/DSP_Schema_2020-21.pdf, udise/docs/DSP_Schema_2024-25.pdf
  note: 2021-22 is not held; the gap is in what was downloaded from the portal.

columns:
  - name: academic_year
    type: STRING
    mode: REQUIRED
    description: 'Academic year of the edition, e.g. "2024-25".'

  - name: academic_year_start
    type: INTEGER
    mode: REQUIRED
    description: Calendar year the academic year starts in. The partitioning key — filter on it.

  - name: pseudocode
    type: STRING
    mode: REQUIRED
    description: Pseudonymised school id. Joins to udise_dim_school_dsp on (academic_year, pseudocode).

  - name: building_status_code
    type: STRING
    mode: NULLABLE
    description: >
      DCF building status: '1' Private, '2' Rented, '3' Government, '4' Govt. school
      in rent-free building, '5' No building, '7' Under construction, '10' Running in
      another department's building. See codemaps/dsp_building_status.csv.
      '5' is the one to look for — a school with no building at all.

  - name: classrooms_total
    type: INTEGER
    mode: NULLABLE
    description: Classrooms used for instruction. The denominator for a students-per-classroom read.

  - name: classrooms_good_condition
    type: INTEGER
    mode: NULLABLE
    description: >
      Classrooms in good condition. With classrooms_need_minor_repair and
      classrooms_need_major_repair these partition classrooms_total.

  - name: classrooms_need_minor_repair
    type: INTEGER
    mode: NULLABLE
    description: Classrooms needing minor repair.

  - name: classrooms_need_major_repair
    type: INTEGER
    mode: NULLABLE
    description: Classrooms needing major repair. The infrastructure-distress signal.

  - name: girls_toilets
    type: INTEGER
    mode: NULLABLE
    description: >
      Toilet seats for girls, EXCLUDING CWSN-friendly ones (those are counted
      separately in girls_cwsn_toilets). Availability, not functionality — pair it
      with girls_toilets_functional, which is the number that matters for whether
      girls actually stay in school.

  - name: girls_toilets_functional
    type: INTEGER
    mode: NULLABLE
    description: >
      Functional toilet seats for girls. Use this, not girls_toilets, for any
      girls'-access analysis: a school can report toilets and none of them working.

  - name: boys_toilets
    type: INTEGER
    mode: NULLABLE
    description: Toilet seats for boys, excluding CWSN-friendly ones.

  - name: boys_toilets_functional
    type: INTEGER
    mode: NULLABLE
    description: Functional toilet seats for boys.

  - name: girls_cwsn_toilets
    type: INTEGER
    mode: NULLABLE
    description: >
      CWSN-friendly toilet seats for girls. 2022-23 onward only — 2020-21 publishes
      the functional count without a total.

  - name: girls_cwsn_toilets_functional
    type: INTEGER
    mode: NULLABLE
    description: Functional CWSN-friendly toilet seats for girls. Present in every edition.

  - name: girls_urinals
    type: INTEGER
    mode: NULLABLE
    description: Urinals for girls. Source misspells this `urinla_girls` in 2020-21; normalised here.

  - name: electricity_code
    type: STRING
    mode: NULLABLE
    description: >
      '1' = Yes, '2' = No, '3' = Yes but not functional. NOT a plain yes/no — a
      truthiness test counts the non-functional connections as working.

  - name: library_available
    type: STRING
    mode: NULLABLE
    description: 'Library available. Yes=1, No=2.'

  - name: playground_available
    type: STRING
    mode: NULLABLE
    description: 'Playground available. Yes=1, No=2. From 2022-23 playground_alternative_yn covers schools using an adjoining park instead.'

  - name: internet
    type: STRING
    mode: NULLABLE
    description: 'Internet available. Yes=1, No=2. With desktops/laptops/smart_classrooms, the digital-readiness read.'

  - name: furniture_code
    type: STRING
    mode: NULLABLE
    description: "'1' Yes for all students, '2' Partial, '3' No furniture available."

  - name: ramps_available
    type: STRING
    mode: NULLABLE
    description: 'Ramp for disabled children to access the school building. Yes=1, No=2.'

  - name: physics_lab_code
    type: STRING
    mode: NULLABLE
    description: >
      Physics laboratory availability and condition, as a DCF code. 2022-23 onward.
      Eight sibling columns cover chemistry, biology, maths, language, geography,
      home science, psychology and computer science. The codebooks do not publish
      the condition code list, so no label is derived.

  - name: cctv_yn
    type: STRING
    mode: NULLABLE
    description: 'CCTV cameras installed. Yes=1, No=2. 2025-26 ONLY — NULL, not "no", in every earlier edition.'

  - name: girls_trained_self_defence
    type: INTEGER
    mode: NULLABLE
    description: >
      Girls who received self-defence training. 2025-26 ONLY. A count, not a flag —
      the companion self_defence_offered_yn is the flag.

  - name: disaster_mgmt_plan_yn
    type: STRING
    mode: NULLABLE
    description: 'School Disaster Management Plan in place. Yes=1, No=2. 2025-26 ONLY.'

  - name: fire_extinguisher_yn
    type: STRING
    mode: NULLABLE
    description: 'Fire extinguisher available. Yes=1, No=2. 2025-26 ONLY.'

# Columns not listed individually follow the pattern of their named sibling and are
# documented by the coverage groups in the description above: the twelve
# water_*_yn columns, the remaining lab condition codes, the digital-equipment
# counts (laptops, tablets, desktops, digital_boards, teaching_devices, servers,
# smart_classrooms, projectors, printers, dth), the 2025-26 amenity flags
# (librarian_yn, land_available_yn, kitchen_garden_yn, staff_quarters_yn,
# tinkering_lab_yn, boarding_*_yn, enrichment_activities_yn), and the rest of the
# 2025-26 safety block (structural_safety_audit_yn, nonstructural_safety_audit_yn,
# safety_nodal_teacher_yn, safety_training_yn, disaster_mgmt_taught_yn,
# self_defence_offered_yn, safety_guidelines_displayed_yn,
# teacher_first_level_counsellor_yn, safety_security_audit_yn,
# teacher_photo_displayed_yn, vidya_pravesh_yn, student_attendance_tracked_yn,
# teacher_attendance_tracked_yn, youth_club_yn, eco_club_yn, teacher_id_card_yn,
# self_certification_yn).
