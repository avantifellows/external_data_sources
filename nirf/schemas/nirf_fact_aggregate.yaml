# nirf_fact_aggregate
#
# Wide table joining rankings with the most-asked-about admissions / placement /
# salary metrics. One row per institute per ranking_year per ranking_category per
# academic_year per program type (UG/PG).
#
# DERIVED, not ingested — there is no raw/nirf_aggregate.parquet. scripts/
# build_clean.py pivots the DEDUPLICATED nirf_fact_master long→wide with
# aggfunc='max', then left-joins it onto nirf_fact_rankings.
#
# ⚠️ HISTORY: the previous build pivoted the *un*-deduplicated master
# with aggfunc='SUM', so duplicated rows were ADDED — inflating every measure 2–3×
# for ~40–54 institutes per year, including median_salary, which cannot be summed
# under any aggregation rule. 1,790 of 31,718 rows carried inflated measures.
# build_clean.py now asserts the master grain is unique BEFORE pivoting, so this
# cannot recur silently. If that assertion fires, fix the dedup — don't relax it.
# percentage_placed and admission_rate were never wrong — being ratios of two
# equally-inflated numbers, the factor always cancelled.
#
# Measure columns inherit master's `category` values, which contain spaces and `%`
# that BigQuery rejects as identifiers; build_clean.py renames them (see
# scripts/sources.py → AGGREGATE_RENAMES). clean/, GCS and BQ all agree.
#
# Source parquet: gs://avantifellows-external-data/nirf/clean/nirf_aggregate.parquet
# BQ table:       avantifellows.external_data_sources.nirf_fact_aggregate

description: NIRF rankings joined with placement, salary, and admission metrics (derived from clean master).
rows: 31718
grain: (institute_id, ranking_year, ranking_category, academic_year, type)

known_limitations:
  - "Inherits everything in nirf_fact_master.yaml → known_limitations, notably
     that PG outcomes cover only 3 academic years (2021-22 → 2023-24) vs ten for
     UG. Do not read a UG+PG time series off this table."
  - "Rows exist for every ranked institute (it is a LEFT JOIN from rankings), so
     measures are NULL wherever master has no data — including for the 93
     institutes absent from master entirely. NULL here means 'not extracted',
     not 'zero'."
  - "If you need a metric this table lacks, pivot clean nirf_fact_master rather
     than editing this one."

columns:
  - name: ranking_year
    type: INTEGER
    mode: REQUIRED
    description: Year of NIRF ranking.

  - name: ranking_category
    type: STRING
    mode: REQUIRED
    description: Discipline (Engineering, Management, …).

  - name: institute_id
    type: STRING
    mode: REQUIRED

  - name: institute_name
    type: STRING
    mode: REQUIRED

  - name: state
    type: STRING

  - name: city
    type: STRING

  - name: overall_score
    type: FLOAT
    mode: NULLABLE
    description: NIRF overall score. NULL for future unranked-submitter rows.

  - name: nirf_rank
    type: INTEGER
    mode: NULLABLE
    description: NIRF rank within (category, year). NULL for unranked submitters.

  - name: academic_year
    type: STRING
    mode: NULLABLE
    description: Academic year these metrics describe (e.g. "2022-23"). Can be NULL.

  - name: type
    type: STRING
    description: |
      Program type and duration. Examples: "UG [4 Years Program(s)]",
      "PG [2 Year Program(s)]", "UG [3 Years Program(s)]".

  - name: median_salary
    type: FLOAT
    mode: NULLABLE
    description: Median annual placement salary in INR. Source col was "Median salary of placed graduates".

  - name: first_year_intake
    type: FLOAT
    mode: NULLABLE
    description: Total sanctioned intake for first year. Source col "Number of first year students intake".

  - name: first_year_admitted
    type: FLOAT
    mode: NULLABLE
    description: Students actually admitted in first year. Source col "Number of first year students admitted".

  - name: lateral_entry_admitted
    type: FLOAT
    mode: NULLABLE
    description: Lateral-entry admissions. Source col "Number of students admmited through lateral entry" (sic).

  - name: graduating_on_time
    type: FLOAT
    mode: NULLABLE
    description: Students who graduated within the minimum stipulated time. Source col "Number of students graduating in min stipulated time".

  - name: students_placed
    type: FLOAT
    mode: NULLABLE
    description: Students who got placements. Source col "Number of students placed".

  - name: higher_studies_selected
    type: FLOAT
    mode: NULLABLE
    description: Students who proceeded to higher studies. Source col "Number of students selected for higher studies".

  - name: percentage_placed
    type: FLOAT
    mode: NULLABLE
    description: (students_placed / graduating_on_time) * 100. Source col "Percentage Placed (%)".

  - name: admission_rate
    type: FLOAT
    mode: NULLABLE
    description: (first_year_admitted / first_year_intake) * 100. Source col "Admission Rate (%)".
