# naac_fact_universities
#
# NAAC-accredited universities with valid accreditation as of 14-Aug-2025.
# One row per university. Sourced from the "Universities" sheet of the
# official NAAC download: naac.gov.in → Accreditation Status.
#
# NAAC accreditation is valid for 5 years per cycle (7 years if top grade
# in two consecutive prior cycles). Cycle number = how many full accreditation
# rounds the university has completed in its history.
# Grade bands: A++ (3.51–4.00) > A+ (3.26–3.50) > A (3.01–3.25) >
#              B++ (2.76–3.00) > B+ (2.51–2.75) > B (2.01–2.50) >
#              C (1.51–2.00). Below 1.51 = not accredited.
#
# Source xlsx: gs://avantifellows-external-data/naac/  (raw committed to repo)
# Source parquet: gs://avantifellows-external-data/naac/naac_fact_universities.parquet
# BQ table: avantifellows.external_data_sources.naac_fact_universities

description: NAAC-accredited universities — grade, CGPA, cycle, and declaration date. Data as of 14-Aug-2025.
rows: 497
grain: (aishe_id)  # one row per university; aishe_id is the stable national identifier

columns:
  - name: sl_no
    type: INTEGER
    description: Serial number within this sheet (source ordering only; not a stable key).

  - name: hei_name
    type: STRING
    description: Full official name of the university as registered with NAAC.

  - name: track_id
    type: STRING
    description: |
      NAAC's internal tracking identifier for the institution.
      Prefix encodes state + institution type (e.g. AP = Andhra Pradesh,
      UN = University, CO = College, GN = Government/aided).

  - name: aishe_id
    type: STRING
    description: |
      All India Survey on Higher Education (AISHE) unique code.
      Format: U-XXXX for universities. Stable national identifier —
      use this to join with NIRF (nirf_fact_master.institute_id may differ;
      prefer name-based matching or a manual crosswalk).

  - name: address
    type: STRING
    description: |
      Postal address of the university. Format varies; typically
      "locality, city, district, state, pincode". May contain
      embedded newlines in the source (cleaned to spaces on load).

  - name: current_cycle_number
    type: INTEGER
    description: |
      Number of full NAAC accreditation cycles completed.
      Cycle 1 = first-ever accreditation; Cycle 5 = accredited continuously
      for ~25 years. A lapsed-then-reapplied institution resets to Cycle 1.

  - name: current_cgpa
    type: FLOAT
    description: |
      Cumulative Grade Point Average on a 0–4.00 scale, computed across
      NAAC's seven assessment criteria. Determines the letter grade.

  - name: current_grade
    type: STRING
    description: |
      Letter grade: A++, A+, A, B++, B+, B, or C.
      As of Feb 2025 NAAC announced a new Binary framework (Accredited/Not),
      but the CGPA/letter system is still operative for this dataset.

  - name: date_of_declaration
    type: DATE
    description: |
      Date the current accreditation cycle was formally declared.
      Accreditation is valid for 5 years from this date (7 years for
      sustained top-grade performers). Source format DD-MM-YYYY.

  - name: data_as_of
    type: DATE
    description: |
      Date the source file was published on naac.gov.in (2025-08-14).
      Use to reason about data freshness — a grade from 2020 is 5 years
      old even though the file was downloaded in 2025.
